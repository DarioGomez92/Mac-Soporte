<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="paginaCarrito">
    <!-- Contenedor que carga el navegador almacenado en el js -->
    <div id="contenedorNavegador"></div>

    <div class="contenedorCarrito">
        <h1 class="tituloCarrito">Carrito de Compras</h1>
        <div id="carritoVacio" class="carritoVacio">
          <p class="mensajeVacio">Tu carrito está vacío.</p>
          <p class="mensajeAdicional">Para añadir productos a tu carrito, visita nuestra tienda.</p>
          <a href="tienda.html" class="botonTienda">Ir a la tienda</a>
        </div>

        <table id="tablaCarrito" class="aparecer" style="display: none;">
            <thead>
              <tr>
                <th>PRODUCTO</th>
                <th>PRECIO</th>
                <th>CANTIDAD</th>
                <th>SUBTOTAL</th>
                <th>BORRAR</th>
              </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
            <tfoot>
              <tr>
                <td colspan="3" class="total">Total</td>
                <td colspan="2" class="total" id="totalCarrito">0 €</td>
              </tr>
            </tfoot> 
        </table>

        <div class="contenedorBotonPago aparecer" id="pagarAhora" style="display: none;">
          <form action="php/crearSesionPago.php" method="POST">
              <button type="submit" class="botonPagarAhora">Pagar ahora</button>
          </form>
        </div>

        
    </div>
    <!-- Contenedor que carga el footer almacenado en su js -->
    <div id="contenedorFooter"></div>

    <script src="js/animaciones.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
